        <div id="logEntries"></div>
        <p><a href="/">Back</a></p>
        <div class="placeholder-img"></div>
        <audio controls><source src="" type="audio/mpeg"></audio>
        <script>
            async function fetchLogs() {
                const res = await fetch('/logs', { headers: { 'Accept': 'application/json' } });
                const logs = await res.json();
                document.getElementById('logEntries').innerHTML = logs.map(log =>
                    `<div class="log">[${log.timestamp}] ${log.content}</div>`
                ).join('');
            }
            fetchLogs();
            setInterval(fetchLogs, 10000);
        </script>
