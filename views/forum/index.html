<!DOCTYPE html>
<html>
<head>
    <title>// FORUM //</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .post { border:1px solid #555; padding:8px; margin:8px 0; }
        .post h3 { margin:0 0 4px; }
        .post small { color:#999; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h1>0x4B6C7972::0xDEAD:#0x11E79</h1>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li class="has-sub">Information
                    <ul class="sub">
                        <li><a href="/information/lore">Lore</a></li>
                        <li><a href="/information/rules">Rules</a></li>
                        <li><a href="/stories">Stories</a></li>
                    </ul>
                </li>
                <li><a href="/articles">Articles</a></li>
                <li><a href="/gallery">Gallery</a></li>
                <li><a href="/media">Media</a></li>
                <li><a href="/extras">Extras</a></li>
                <li><a href="/forum">Forum</a></li>
                <li><a href="/about">About Us</a></li>
            </ul>
        </nav>
    </div>
    <div class="main">
        <h2>// FORUM //</h2>
        <p>Post horrific tales or read what others have suffered.</p>
        <form id="postForm">
            <input type="text" id="author" placeholder="Your name (optional)" />
            <input type="text" id="title" placeholder="Title" required />
            <textarea id="content" placeholder="Write something..." required></textarea>
            <button type="submit">Submit</button>
        </form>
        <div id="posts"></div>
    </div>
    <footer>All Rights Reserved © 2026 Your Name Here. Design: ModBlackmoon</footer>
    <script>
        async function loadPosts() {
            const res = await fetch('/forum/posts');
            const list = await res.json();
            const container = document.getElementById('posts');
            container.innerHTML = '';
            list.forEach(p => {
                const div = document.createElement('div');
                div.className = 'post';
                div.innerHTML = `<h3>${p.title}</h3><small>by ${p.author||'Anonymous'} at ${p.timestamp}</small><p>${p.content}</p>`;
                container.appendChild(div);
            });
        }
        document.getElementById('postForm').addEventListener('submit', async e => {
            e.preventDefault();
            const author = document.getElementById('author').value;
            const title = document.getElementById('title').value;
            const content = document.getElementById('content').value;
            await fetch('/forum/posts', {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body: JSON.stringify({author,title,content})
            });
            document.getElementById('title').value='';
            document.getElementById('content').value='';
            loadPosts();
        });
        loadPosts();
    </script>
</body>
</html>
