</head>
<body>
    <div class="sidebar">
        <h1>0x4B6C7972::0xDEAD:#0x11E79</h1>
        <nav>
            <a href="/">Home</a>
            <a href="/information">Information</a>

    <div class="main">
        <h2>// MIRROR //</h2>
        <p>You look into the mirror, but your reflection... is different. It smiles when you don't.</p>
        <div class="data" id="mirrorData">
            <p>Loading...</p>
        </div>
        <p><a href="/">Back</a></p>
        <div class="placeholder-img"></div>
        <audio controls><source src="" type="audio/mpeg"></audio>
        <script>
            fetch('/session-data')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('mirrorData').innerHTML = `
                        <p>IP: ${data.ip}</p>
                        <p>Session: ${data.sessionId}</p>
                        <p>Visit Count: ${data.visitCount}</p>
                        <p>First Visit: ${data.firstVisit}</p>
                        <p>Last Page: ${data.lastPage}</p>
                        <p>Pages Visited: ${data.pagesVisited.join(', ')}</p>
                    `;
                });
        </script>
    </div>
