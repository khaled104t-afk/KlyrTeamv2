<!DOCTYPE html>
<html>
<head>
    <title>// STORY //</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/script.js"></script>
</head>
<body>
    <div class="sidebar">
        <h1>0x4B6C7972::0xDEAD:#0x11E79</h1>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li class="has-sub">Information
                    <ul class="sub">
                        <li><a href="/information/lore">Lore</a></li>
                        <li><a href="/information/rules">Rules</a></li>
                        <li><a href="/stories">Stories</a></li>
                    </ul>
                </li>
                <li><a href="/articles">Articles</a></li>
                <li><a href="/gallery">Gallery</a></li>

                <li><a href="/forum">Forum</a></li>
                <li><a href="/about">About Us</a></li>
            </ul>
        </nav>
    </div>
    <div class="main">
        <h2 id="storyTitle">Loading...</h2>
        <small id="storyMeta"></small>
        <p id="storyBody"></p>
    </div>
    <footer>All Rights Reserved © 2026 Your Name Here. Design: ModBlackmoon</footer>
    <script>
        async function loadStory() {
            const id = window.location.pathname.split('/').pop();
            const res = await fetch('/stories/' + id);
            if (res.ok) {
                const s = await res.json();
                document.getElementById('storyTitle').textContent = s.title;
                document.getElementById('storyMeta').textContent = `by ${s.author||'Anon'} at ${s.timestamp}`;
                document.getElementById('storyBody').textContent = s.body;
            } else {
                document.getElementById('storyTitle').textContent = 'Not found';
                document.getElementById('storyBody').textContent = '';
            }
        }
        loadStory();
    </script>
</body>
</html>
