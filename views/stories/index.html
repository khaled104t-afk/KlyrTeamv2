<!DOCTYPE html>
<html>
<head>
    <title>// STORIES //</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/script.js"></script>
</head>
<body>
    <div class="sidebar">
        <h1>0x4B6C7972::0xDEAD:#0x11E79</h1>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li class="has-sub">Information
                    <ul class="sub">
                        <li><a href="/information/lore">Lore</a></li>
                        <li><a href="/information/rules">Rules</a></li>
                        <li><a href="/stories">Stories</a></li>
                    </ul>
                </li>
                <li><a href="/articles">Articles</a></li>
                <li><a href="/gallery">Gallery</a></li>
                <li><a href="/media">Media</a></li>
                <li><a href="/extras">Extras</a></li>
                <li><a href="/forum">Forum</a></li>
                <li><a href="/about">About Us</a></li>
            </ul>
        </nav>
    </div>
    <div class="main">
        <h2>// STORIES //</h2>
        <form id="storyForm">
            <input type="text" id="author" placeholder="Name (optional)" />
            <input type="text" id="title" placeholder="Title" required />
            <textarea id="body" placeholder="Your tale..." required></textarea>
            <button type="submit">Submit</button>
        </form>
        <div id="storyList"></div>
    </div>
    <footer>All Rights Reserved © 2026 Your Name Here. Design: ModBlackmoon</footer>
    <script>
        async function loadStories() {
            const res = await fetch('/stories');
            const list = await res.json();
            const container = document.getElementById('storyList');
            container.innerHTML = '';
            list.forEach(s => {
                const div = document.createElement('div');
                div.className = 'post';
                div.innerHTML = `<h3><a href=\"/stories/${s.id}\">${s.title}</a></h3><small>by ${s.author||'Anon'} at ${s.timestamp}</small><p>${s.body}</p>`;
                container.appendChild(div);
            });
        }
        document.getElementById('storyForm').addEventListener('submit', async e => {
            e.preventDefault();
            const author = document.getElementById('author').value;
            const title = document.getElementById('title').value;
            const body = document.getElementById('body').value;
            await fetch('/stories', {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body: JSON.stringify({author,title,body})
            });
            document.getElementById('title').value='';
            document.getElementById('body').value='';
            loadStories();
        });
        loadStories();
    </script>
</body>
</html>
